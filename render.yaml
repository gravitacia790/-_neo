services:
  - type: web
    name: gravitacia-neo
    env: node
    plan: free
    region: frankfurt
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: gravitacia-neo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: gravitacia-neo-db
    plan: free
    region: frankfurt
    databaseName: gravitacia
    user: gravitacia
