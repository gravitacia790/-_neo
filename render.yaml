services:
  - type: web
    name: gravitacia
    env: node
    plan: free
    region: frankfurt
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: 1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_ANSWER_MODEL
        value: gpt-5.4-mini
      - key: DATABASE_URL
        fromDatabase:
          name: gravitacia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: gravitacia-db
    plan: free
    region: frankfurt
    databaseName: gravitacia
    user: gravitacia
