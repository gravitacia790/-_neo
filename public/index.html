<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Гравитация NEO">
    <title>Гравитация NEO — Московская область</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="gravity-wordmark">
                <span class="gravity-text">Гравитация</span>
                <span class="gravity-sub">NEO</span>
            </div>
            <div class="region-text">Московская область</div>
            <div class="tagline">Профессиональное сообщество директоров школ</div>
            <div class="auth-buttons">
                <button class="auth-btn primary" id="loginBtn">Вход</button>
                <button class="auth-btn secondary" id="registerBtn">Регистрация</button>
            </div>
            <div class="install-prompt" id="installPrompt" style="display: none;">
                <span>Установить как приложение</span>
                <button id="installBtn">Установить</button>
            </div>
            <div class="community-stats"><span class="stat-dot"></span> Сообщество директоров <span class="stat-count">287</span></div>
        </div>
    </div>
    <div class="main-content" id="mainContent">
        <div class="header">
            <div class="header-brand">
                <span class="header-icon">G</span>
                <span class="header-title">Гравитация</span>
            </div>
            <button class="logout-btn" id="logoutBtn">Выйти</button>
        </div>
        <nav class="top-nav" id="topNav">
            <button data-tab="profile"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span> <span>Профиль</span></button>
            <button data-tab="school"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M6 21V7l6-4 6 4v14"/><path d="M10 21v-6h4v6"/></svg></span> <span>Школа</span></button>
            <button data-tab="events"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span> <span>Мероприятия</span></button>
            <button data-tab="directors"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> <span>Директора</span></button>
            <button data-tab="mentors"><span class="nav-icon"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/><path d="M12 6v6l3 2"/></svg></span> <span>Наставники</span></button>
        </nav>
        <div class="tab-content" id="profile"></div>
        <div class="tab-content" id="school"></div>
        <div class="tab-content" id="events"></div>
        <div class="tab-content" id="directors"></div>
        <div class="tab-content" id="mentors"></div>
        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-item" data-newtab="expert"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg></span><span>Экспертное</span></button>
            <button class="nav-item" data-newtab="gl"><span class="nav-icon"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span><span>ГЛ</span></button>
            <button class="nav-item" data-newtab="internship"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></span><span>Стажировка</span></button>
            <button class="nav-item" data-newtab="calendar"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m9 16 2 2 4-4"/></svg></span><span>Календарь</span></button>
            <button class="nav-item admin-only" id="adminNavBtn" data-newtab="admin" style="display:none;"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span><span>Админ</span></button>
        </nav>
        <div class="tab-content" id="expert"></div>
        <div class="tab-content" id="gl"></div>
        <div class="tab-content" id="internship"></div>
        <div class="tab-content" id="calendar"></div>
        <div class="tab-content" id="admin"></div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/rating.js"></script>
<script src="/js/data.js"></script>
<script src="/js/events.js"></script>
<script src="/js/directors.js"></script>
<script src="/js/profile.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/tabs.js"></script>
<script src="/js/bottom.js"></script>

<script>
(function () {
  function showMainApp() {
    document.getElementById('splashScreen').style.display = 'none';
    var main = document.getElementById('mainContent');
    main.classList.add('active');
    var adminBtn = document.getElementById('adminNavBtn');
    if (adminBtn) adminBtn.style.display = isAdmin() ? 'flex' : 'none';
    loadUserDataIntoForms().then(function () {
      initTabs();
      initPWA();
    });
  }

  document.getElementById('profile').innerHTML =
    '<h2 class="tab-title">Профиль директора</h2>' +
    '<div class="form-group"><label class="form-label">Фото директора</label><input type="file" id="directorPhoto" accept="image/jpeg,image/png,image/webp"><div id="photoPreview" class="photo-preview"></div></div>' +
    '<div class="form-group"><label class="form-label">ФИО полностью</label><input type="text" id="directorName" placeholder="Иванов Иван Иванович"></div>' +
    '<div class="form-group"><label class="form-label">Email</label><input type="email" id="directorEmail" placeholder="director@school.ru"></div>' +
    '<div class="form-group"><label class="form-label">Телефон</label><input type="tel" id="directorPhone" placeholder="+7 (999) 999-99-99"></div>' +
    '<h3 class="section-label">Мои сильные стороны</h3><div id="strengthsList"></div>' +
    '<button class="add-btn" onclick="addStrength()">+ Добавить качество</button>' +
    '<h3 class="section-label">Профессиональные навыки</h3><div id="skillsList"></div>' +
    '<button class="add-btn" onclick="addSkill()">+ Добавить навык</button>' +
    '<h3 class="section-label">Уникальный опыт</h3><div class="form-group"><textarea id="uniqueExperience" rows="3" placeholder="Расскажите о вашем уникальном профессиональном опыте..."></textarea></div>' +
    '<h3 class="section-label">Личные интересы</h3><div class="form-group"><textarea id="personalInterests" rows="3" placeholder="Ваши хобби, увлечения и интересы..."></textarea></div>' +
    '<div class="checkbox-label"><input type="checkbox" id="mentorCheckbox"><label for="mentorCheckbox">Готов стать наставником будущих лидеров в сфере образования</label></div>' +
    '<div class="checkbox-label"><input type="checkbox" id="consentCheckbox"><label for="consentCheckbox">Согласен на обработку персональных данных</label></div>' +
    '<button class="save-btn" onclick="saveProfile()">Сохранить профиль</button><div id="ratingDisplay"></div>';

  document.getElementById('school').innerHTML =
    '<h2 class="tab-title">Информация о школе</h2>' +
    '<div class="form-group"><label class="form-label">Полное название школы</label><input type="text" id="schoolName" placeholder="МБОУ СОШ №1"></div>' +
    '<div class="form-group"><label class="form-label">Адрес школы</label><input type="text" id="schoolAddress" placeholder="г. Москва, ул. Школьная, 1"></div>' +
    '<div class="form-group"><label class="form-label">Количество учеников</label><input type="number" id="studentCount" placeholder="500"></div>' +
    '<div class="form-group"><label class="form-label">Количество педагогов</label><input type="number" id="teacherCount" placeholder="30"></div>' +
    '<div class="form-group"><label class="form-label">Тип школы</label><select id="schoolType"><option>Средняя общеобразовательная</option><option>Гимназия</option><option>Лицей</option></select></div>' +
    '<div class="form-group"><label class="form-label">Количество зданий</label><input type="number" id="buildingCount" placeholder="1"></div>' +
    '<div class="form-group"><label class="form-label">Могу быть полезен:</label><textarea id="usefulExperience" rows="3"></textarea></div>' +
    '<div class="form-group"><label class="form-label">Хочу узнать:</label><textarea id="wantToKnow" rows="3"></textarea></div>' +
    '<button class="save-btn" onclick="saveSchool()">Сохранить информацию</button>';

  document.getElementById('events').innerHTML =
    '<h2 class="tab-title">Обмен опытом: мероприятия</h2>' +
    '<div class="create-event-card">' +
    '<h3 class="section-label">Создать мероприятие</h3>' +
    '<div class="form-group"><label class="form-label">Название</label><input type="text" id="eventTitle" placeholder="Мастер-класс по цифровизации"></div>' +
    '<div class="form-group"><label class="form-label">Дата и время</label><input type="text" id="eventDate" placeholder="15 мая 2026, 14:00"></div>' +
    '<div class="form-group"><label class="form-label">Описание</label><textarea id="eventDesc" rows="2"></textarea></div>' +
    '<div class="form-group"><label class="form-label">Максимум участников</label><input type="number" id="eventMax" placeholder="10"></div>' +
    '<div class="checkbox-label"><input type="checkbox" id="eventSpeakerCheckbox"><label for="eventSpeakerCheckbox">Я буду спикером на этом мероприятии (+15 баллов)</label></div>' +
    '<button class="save-btn" id="createEventBtn">Создать мероприятие</button></div>' +
    '<h3 class="section-label" style="margin-top: 24px;">Доступные мероприятия</h3><div id="eventsList"></div>';

  document.getElementById('directors').innerHTML =
    '<h2 class="tab-title">Директора школ</h2>' +
    '<div class="search-container"><input type="text" id="directorSearchInput" class="search-input" placeholder="Поиск по имени, школе..."></div>' +
    '<div id="directorsList" class="directors-grid"></div>';

  document.getElementById('mentors').innerHTML =
    '<h2 class="tab-title">Потенциальные наставники</h2><div id="mentorsList"></div>';

  document.getElementById('expert').innerHTML =
    '<h2 class="tab-title">Экспертное мнение</h2>' +
    '<div class="expert-card"><h3>Тренды в образовании 2026</h3><p>Цифровая трансформация, персонализация обучения, развитие soft skills. Эксперты сообщества делятся прогнозами.</p></div>' +
    '<div class="expert-card"><h3>Управление изменениями</h3><p>Как внедрить новые практики без сопротивления коллектива? Опыт директоров из Московской области.</p></div>' +
    '<div class="expert-card"><h3>Финансовая автономия школы</h3><p>Привлечение внебюджетных средств, гранты, партнёрства с бизнесом. Реальные кейсы.</p></div>';

  document.getElementById('loginBtn').onclick = showLoginModal;
  document.getElementById('registerBtn').onclick = showRegisterModal;
  document.getElementById('logoutBtn').onclick = logout;

  document.querySelectorAll('button.save-btn').forEach(function (btn) {
    var t = (btn.textContent || '').trim();
    if (t === 'Сохранить профиль') btn.onclick = saveProfile;
    if (t === 'Сохранить информацию') btn.onclick = saveSchool;
  });

  bindCreateEvent();
  bindDirectorSearch();

  window.showMainApp = showMainApp;

  if (API.isAuthed()) {
    API.me().then(function (resp) {
      API.setUser(resp.user);
      showMainApp();
    }).catch(function () {
      API.clearToken();
      document.getElementById('splashScreen').style.display = 'flex';
    });
  } else {
    document.getElementById('splashScreen').style.display = 'flex';
  }
})();
</script>
</body>
</html>
