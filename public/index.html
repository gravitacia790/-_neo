<div id="app" data-app-state="intro">
    <main class="intro-screen" id="introScreen" aria-labelledby="introTitle" aria-describedby="introStatus">
        <div class="intro-mark">
            <span class="intro-mark__ring" aria-hidden="true"></span>
            <span class="intro-mark__letter">G</span>
        </div>
        <h1 class="intro-title" id="introTitle">&#1043;&#1088;&#1072;&#1074;&#1080;&#1090;&#1072;&#1094;&#1080;&#1103;</h1>
        <p class="intro-status" id="introStatus">&#1055;&#1086;&#1076;&#1075;&#1086;&#1090;&#1072;&#1074;&#1083;&#1080;&#1074;&#1072;&#1077;&#1084; &#1087;&#1088;&#1086;&#1089;&#1090;&#1088;&#1072;&#1085;&#1089;&#1090;&#1074;&#1086;</p>
        <div class="intro-loader" aria-hidden="true"><span></span><span></span><span></span></div>
    </main>
    <main class="splash-screen" id="splashScreen" aria-labelledby="splashTitle">
        <section class="splash-content" aria-describedby="splashTagline splashStatsStatus">
            <header class="gravity-wordmark">
                <h1 class="gravity-text" id="splashTitle">Гравитация</h1>
            </header>
            <p class="region-text">Московская область</p>
            <p class="tagline" id="splashTagline">Профессиональное сообщество руководителей образования</p>

                <button class="auth-btn primary" id="loginBtn" aria-label="Открыть форму входа">Вход</button>
                <button class="auth-btn secondary" id="registerBtn" aria-label="Открыть форму регистрации">Регистрация</button>
            </div>
            <div class="community-stats" id="splashStatsStatus" role="status" aria-live="polite" data-loading="true"><span class="stat-dot"></span> Сообщество директоров <span class="stat-count" id="communityCount">Загрузка</span></div>
        </section>
    </main>

            <div class="header-brand">
                <span class="header-icon">G</span>
                <span class="header-title">Гравитация</span>

                <div class="notif-dropdown" id="notifDropdown" hidden>
                    <div class="notif-header">
                        <span>Уведомления</span>
                        <button id="notifMarkAllRead" class="notif-header-action">Прочитать всё</button>
                    </div>
